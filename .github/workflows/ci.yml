name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base branch is needed to compare migrations
      - name: Merged migrations are never edited, renamed or deleted
        if: github.event_name == 'pull_request'
        run: >-
          git diff --exit-code --name-status --diff-filter=MDR
          origin/${{ github.base_ref }}...HEAD -- migrations/versions
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest
